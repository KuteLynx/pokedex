<div class="pokedex-container">
  <header class="pokedex-header">
    <div class="header-top">
      <div class="pokeball-icon"></div>
      <h1>Pokedex</h1>
    </div>
    <div class="search-bar">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          placeholder="Buscar por nombre o numero..."
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
          (keyup.enter)="onSearch()"
        />
        @if (searchTerm()) {
          <button class="clear-btn" (click)="clearSearch()">✕</button>
        }
      </div>
      <button class="search-btn" (click)="onSearch()">Buscar</button>
    </div>
  </header>

  @if (loading() && !loadingMore()) {
    <div class="loading-container">
      <div class="pokeball-spinner"></div>
      <p>Cargando Pokemon...</p>
    </div>
  } @else {
    @if (searchError()) {
      <div class="no-results">
        <p>{{ searchError() }}</p>
        <button (click)="clearSearch()">Ver todos</button>
      </div>
    }

    <div class="pokemon-grid">
      @for (pokemon of filteredPokemons(); track pokemon.id) {
        <app-pokemon-card [pokemon]="pokemon" />
      }
    </div>

    @if (!searchTerm() && hasMore()) {
      <div class="load-more">
        <button (click)="loadMore()" [disabled]="loadingMore()">
          @if (loadingMore()) {
            <span class="mini-spinner"></span> Cargando...
          } @else {
            Cargar mas Pokemon
          }
        </button>
      </div>
    }
  }
</div>
